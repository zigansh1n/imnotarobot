[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "imnotarobot"
version = "0.5.0"
description = "I'm Not a Robot: a free-first captcha solver with a 2Captcha-compatible API and an MCP server"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "httpx", "ddddocr", "pillow", "numpy", "python-multipart", "mcp>=2", "patchright",
                "rumps; sys_platform == 'darwin'", "pyobjc-framework-WebKit; sys_platform == 'darwin'",
                "pyobjc-framework-ServiceManagement; sys_platform == 'darwin'",
                "pyobjc-framework-UserNotifications; sys_platform == 'darwin'"]

[project.scripts]
imnotarobot = "imnotarobot.__main__:main"
imnotarobot-menubar = "imnotarobot.menubar:main"
imnotarobot-mcp = "imnotarobot.mcp_server:main"

[project.optional-dependencies]
test = ["pytest"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]

[tool.setuptools.packages.find]
include = ["imnotarobot*"]

[tool.setuptools.package-data]
imnotarobot = ["assets/*.png", "assets/*.html"]
